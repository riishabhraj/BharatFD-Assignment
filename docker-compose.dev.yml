version: "3.9"

services:
  redis-ds:
    image: redis:6.2.5
    command: redis-server
    container_name: redis-ds
    volumes:
      - ./development/redis:/data
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=password
      - REDIS_PORT=6379
    networks:
      - rishabh
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    volumes:
      - ./development/redis-insight:/data
    ports:
      - "4442:5540"
    depends_on:
      - redis-ds
    networks:
      - rishabh
    environment:
      - REDIS_HOST=redis-ds
      - REDIS_PORT=6379
      - REDIS_PASSWORD=password
    restart: unless-stopped

  mongodb:
    image: mongo
    restart: always
    networks:
      - rishabh
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: username
      MONGO_INITDB_ROOT_PASSWORD: password
      ME_CONFIG_MONGODB_ADMINUSERNAME: username
    volumes:
      - ./development/database:/data/db

  mongo-express:
    image: mongo-express
    restart: always
    ports:
      - "4441:8081"
    networks:
      - rishabh
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: username
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://username:password@mongodb:27017/

networks:
  rishabh:
    external: true
