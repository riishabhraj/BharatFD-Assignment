<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Admin Panel</title>
    <script
        src="https://cdn.tiny.cloud/1/5g3lv4lp41apzwsvji7dw9vhd2pykjmdy4rso4k7037wup1c/tinymce/6/tinymce.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h2>FAQ Management</h2>
        <div id="editor-container">
            <form id="faq-form">
                <div class="mb-3">
                    <label for="question" class="form-label">Question</label>
                    <input type="text" class="form-control" id="question" required>
                </div>
                <div class="mb-3">
                    <label for="answer" class="form-label">Answer</label>
                    <textarea id="answer"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Save FAQ</button>
            </form>
        </div>
    </div>

    <script>
        tinymce.init({
            selector: '#answer',
            plugins: 'link image code table lists',
            toolbar: 'undo redo | formatselect | bold italic | alignleft aligncenter alignright | bullist numlist outdent indent | link image | code',
            height: 300
        });

        document.getElementById('faq-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = document.getElementById('question').value;
            const htmlContent = tinymce.get('answer').getContent();

            try {
                const response = await fetch('/api/admin/faqs', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
                    },
                    body: JSON.stringify({ question, htmlContent })
                });

                if (response.ok) {
                    alert('FAQ saved successfully!');
                    location.reload();
                }
            } catch (error) {
                console.error('Error saving FAQ:', error);
                alert('Error saving FAQ');
            }
        });
    </script>
</body>

</html>
